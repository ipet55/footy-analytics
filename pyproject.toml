[project]
name = "footy-ingest"
version = "0.1.0"
description = "Football data ingestion pipeline into Supabase Postgres"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
enrich = [
    "soccerdata>=1.8",
]

[project.scripts]
footy = "footy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # typer declares defaults via function calls by design
]
